<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOME Hero Section - Accurate</title>
    <link href="https://fonts.googleapis.com/css2?family=Blinker:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Darkened Navy Palette */
            --dome-dark-blue: #0a1b3d;
            --dome-white: #ffffff;
            --dome-text-muted: #cbd5e1;
            --font-main: 'Blinker', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background-color: #f8fafc;
        }

        .hero-section {
            background-color: var(--dome-dark-blue);
            /* Subtle overlay to match the site's texture */
            background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0) 100%);
            color: var(--dome-white);
            padding: 100px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            /* Blinker is quite heavy */
            line-height: 1;
            max-width: 950px;
            margin: 0 0 24px 0;
            text-transform: none;
            letter-spacing: -0.01em;
        }

        .hero-subtitle {
            font-size: 1.35rem;
            font-weight: 300;
            line-height: 1.5;
            max-width: 750px;
            color: var(--dome-text-muted);
            margin-bottom: 48px;
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 4px;
            /* DOME uses sharper corners */
            text-decoration: none;
            transition: background 0.2s ease;
            display: inline-block;
        }

        /* White Primary Button */
        .btn-customer {
            background-color: var(--dome-white);
            color: var(--dome-dark-blue);
        }

        .btn-customer:hover {
            background-color: #e2e8f0;
        }

        /* Transparent Outline Button */
        .btn-provider {
            background-color: transparent;
            color: var(--dome-white);
            border: 2px solid var(--dome-white);
        }

        .btn-provider:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }

            .button-group {
                flex-direction: column;
                width: 100%;
                max-width: 320px;
            }
        }

        .hero-btn {
            text-wrap: nowrap;
            flex: 1 1 0;
            padding: 12px 20px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            line-height: 24px;
            letter-spacing: .5px;
            text-decoration: none;
            transition: all .2s ease;
        }

        .hero-btn--primary {
            background: #2d58a7;
            color: #fff;
            border: 2px solid #2d58a7;
        }

        .hero-btn--secondary {
            background: transparent;
            color: #fff;
            border: 2px solid #2d58a7;
        }
    </style>
</head>

<body>

    <section class="hero-section">

        <h1 class="hero-title">
            The Trusted European Ecosystem for Cloud, Edge & AI Services.
        </h1>
        <p class="hero-subtitle">
            Connecting providers and customers to discover, deliver and scale sovereign digital services across Europe.
        </p>


        <div class="button-group">
            <a href="https://onboard.dome-marketplace.eu/register-customer" class="hero-btn hero-btn--primary">Start
                your customer journey</a>
            <a href="https://onboard.dome-marketplace.eu/register-provider" class="hero-btn hero-btn--secondary">Start
                your provider journey</a>
        </div>
    </section>

</body>

</html>
