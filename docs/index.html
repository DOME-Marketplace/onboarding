<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOME Marketplace - The Trusted European Ecosystem</title>
    <!-- Replace this path with the actual location of your CSS file -->
    <link rel="stylesheet" crossorigin href="index.css">
</head>

<body class="bg-[#020617] text-white overflow-x-hidden">
    <!-- Navbar -->
    <nav
        class="fixed top-0 left-0 w-full z-50 px-6 py-5 flex items-center justify-between border-b border-white/5 backdrop-blur-xl bg-[#020617]/40">
    </nav>

    <!-- Hero Section -->
    <main class="relative min-h-[95vh] flex flex-col items-center justify-center text-center px-6 pt-20">
        <!-- Glow & Arc Effects (CSS Only) -->
        <div class="hero-glow"></div>
        <div class="hero-arc"></div>

        <div class="max-w-4xl z-10">

            <h1 class="text-[2.75rem] md:text-[5rem] font-bold font-display leading-[1.05] tracking-tight mb-8">
                The Trusted <span class="text-blue-500">European</span><br>
                Ecosystem for Cloud,<br>
                Edge & AI Services.
            </h1>

            <p class="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto leading-relaxed mb-12">
                Connecting providers and customers to discover, deliver and scale sovereign digital services across
                Europe.
            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-5">
                <a href="https://onboard.dome-marketplace.eu/register-customer"
                    class="w-full sm:w-auto px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition-all shadow-xl shadow-blue-600/30">
                    Start your customer journey
                </a>
                <a href="https://onboard.dome-marketplace.eu/register-provider"
                    class="w-full sm:w-auto px-8 py-4 bg-white/5 hover:bg-white/10 border border-white/20 text-white font-bold rounded-lg transition-all">
                    Start your provider journey
                </a>
            </div>
        </div>

        <!-- Subtle bottom planet-like glow -->
        <div
            class="absolute bottom-0 w-full h-[30%] bg-gradient-to-t from-blue-500/10 to-transparent pointer-events-none">
        </div>
    </main>
</body>

</html>
